<!DOCTYPE html>
<html lang="ja">
<head>
	<title>タイトル</title>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
    	<h1>	</h1>
    	<p>	</p>
		<button onclick="toggleView()" class="toggle-btn">🔄 表示を切り替える</button>
	</header>
	<main>
		<div id="timeTable">
			<section class="1st-spring">

						<th>時限</th>

						<th>火</th>
						<th>水</th>
						<th>木</th>
						<th>金</th>
						<th>土</th>
					</tr>
					<tr>
						<td>1限</td>
						<td id="月-1"></td>
						<td id="火-1"></td>
						<td id="水-1"></td>
						<td id="木-1"></td>
						<td id="金-1"></td>
						<td id="土-1"></td>
					</tr>
					<tr>
						<td>2限</td>
						<td id="月-2"></td>
						<td id="火-2"></td>

						<td id="木-2"></td>

						<td id="土-2"></td>
					</tr>
					<tr>
						<td>3限</td>
						<td id="月-3"></td>
						<td id="火-3"></td>
						<td id="水-3"></td>
						<td id="木-3"></td>
						<td id="金-3"></td>
						<td id="土-3"></td>
					</tr>
					<tr>
						<td>4限</td>
						<td id="月-4"></td>
						<td id="火-4"></td>

						<td id="木-4"></td>

						<td id="土-4"></td>
					</tr>
					<tr>
						<td>5限</td>
						<td id="月-5"></td>
						<td id="火-5"></td>
						<td id="水-5"></td>
						<td id="木-5"></td>
						<td id="金-5"></td>
						<td id="土-5"></td>
					</tr>
					<tr>
						<td>6限</td>
						<td id="月-6"></td>
						<td id="火-6"></td>
						<td id="水-6"></td>
						<td id="木-6"></td>
						<td id="金-6"></td>
						<td id="土-6"></td>
					</tr>
				</table>
			</section>
		</div>
		<div id="listview" style="display: none;">
			<h2>1春</h2>
			<ul id="courselist"></ul>
		</div>
	</main>

	<script src="main.js"></script>

</html>
